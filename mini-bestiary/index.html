<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="icon"
      type="image/png"
      href="./src/assets/images/favicon-bestiary.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-bestiary</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Eagle+Lake&family=Jacquard+12&family=Macondo+Swash+Caps&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/assets/css/global.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-info">
        <img
          src="./src/assets/images/title-bg.png"
          alt="Imagem de um pergaminho desgastado aberto e com marcas de arranhões"
          class="title-bg"
        />
        <div class="header-text-wrapper">
          <h1 class="header-title">O Códice das Feras</h1>
          <p class="header-call">
            Consulte informações detalhadas de criaturas para sua aventura
          </p>
        </div>
      </div>
    </header>

    <div class="divider-wrapper">
      <div class="divider-ornament">
        <span class="ornament-1"></span>
        <!-- seu SVG de fleur-de-lis aqui -->

        <div class="divider-img-box">
          <img src="./src/assets/images/cross-3.svg" alt="" class="divider-img" />
        </div>
       

        <span class="ornament-2"></span>
      </div>
      <div class="divider-text-box">
        <p>
          Os registros aqui contidos advêm de relatos antigos, bravos guerreiros
          que sobreviveram a um encontro com estes temores...
        </p>
        <p class="divider-signature">- Kelsier</p>
      </div>
    </div>

    <main class="bestiary-grid">
      <div class="creature-entry">
        <article class="creature-card">
          <div class="creature-wrapper">
            <img
              src="./src/assets/images/red-dragon-removebg-preview-1.png"
              alt=""
              class="creature-img"
            />
          </div>
  
        </article>
        <section class="creature-info">
          <div class="parchment--box">
            <img src="./src/assets/images/ornament---a.png" alt="" class="info-parchment">
          </div>
         
          <h2>Dragão Vermelho Ancião</h2>
          
        </section>

      </div>
    </main>

    <footer></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
